name: Android 15 port preflight

on:
  push:
    branches:
      - android-15-port
    paths:
      - 'scripts/android15-preflight.sh'
      - '.github/workflows/android15-preflight.yml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Inspect Android 15 port prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout android-15-port
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git grep coreutils findutils

      - name: Run source preflight
        run: |
          chmod +x scripts/android15-preflight.sh
          scripts/android15-preflight.sh artifacts/android15-preflight

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martini-android15-preflight
          path: artifacts/android15-preflight/
          if-no-files-found: error
          retention-days: 14
